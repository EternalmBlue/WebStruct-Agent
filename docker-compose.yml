services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webstruct_agent
      POSTGRES_USER: webstruct
      POSTGRES_PASSWORD: webstruct
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webstruct -d webstruct_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    env_file:
      - backend.env
    environment:
      DATABASE_URL: postgresql+psycopg://webstruct:webstruct@postgres:5432/webstruct_agent
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
